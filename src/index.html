<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b0d">
    <title>Träningsplanerare</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/screens.css">
    <script src="scripts/app.js" defer></script>
  </head>
  <body>
    <!-- Figma node IDs are retained for reconstruction traceability only. -->
    <main class="app screen-shell" data-node-id="80:199" aria-labelledby="screen-title">
      <header class="screen-header" data-node-id="80:205">
        <h1 id="screen-title" data-node-id="80:206">Träningsplanerare</h1>
      </header>

      <section class="activity-screen" aria-labelledby="activity-heading">
        <h2 class="screen-heading" id="activity-heading" data-node-id="94:675">Välj Aktivitet</h2>

        <div class="activity-groups">
          <section class="activity-group" aria-labelledby="short-outdoor-heading">
            <h3 id="short-outdoor-heading" data-node-id="94:746">Korta Utepass</h3>
            <ul class="activity-option-list">
              <li>
                <button class="activity-option-card" type="button" aria-pressed="false" aria-label="Promenad, 20 minuter, utomhus" data-activity-id="walk" data-node-id="94:680">
                  <span class="activity-option-card__icon" aria-hidden="true"></span>
                  <span class="activity-option-card__content">
                    <span class="activity-option-card__title">Promenad</span>
                    <span class="activity-option-card__description">20 min · Utomhus</span>
                  </span>
                  <span class="activity-option-card__state" aria-hidden="true"></span>
                </button>
              </li>
              <li>
                <button class="activity-option-card" type="button" aria-pressed="false" aria-label="Cykelrunda, 15 minuter, utomhus" data-activity-id="cycle" data-node-id="94:710">
                  <span class="activity-option-card__icon" aria-hidden="true"></span>
                  <span class="activity-option-card__content">
                    <span class="activity-option-card__title">Cykelrunda</span>
                    <span class="activity-option-card__description">15 min · Utomhus</span>
                  </span>
                  <span class="activity-option-card__state" aria-hidden="true"></span>
                </button>
              </li>
            </ul>
          </section>

          <section class="activity-group" aria-labelledby="low-intensity-heading">
            <h3 id="low-intensity-heading" data-node-id="94:745">Låg Intensitet</h3>
            <ul class="activity-option-list">
              <li>
                <button class="activity-option-card" type="button" aria-pressed="false" aria-label="Kroppsviktsövningar, 20 minuter, utomhus" data-activity-id="bodyweight" data-node-id="94:735">
                  <span class="activity-option-card__icon" aria-hidden="true"></span>
                  <span class="activity-option-card__content">
                    <span class="activity-option-card__title">Kroppsviktsövningar</span>
                    <span class="activity-option-card__description">20 min · Utomhus</span>
                  </span>
                  <span class="activity-option-card__state" aria-hidden="true"></span>
                </button>
              </li>
              <li>
                <button class="activity-option-card" type="button" aria-pressed="false" aria-label="Crosstrainer, 25 minuter, inomhus" data-activity-id="cross-trainer" data-node-id="94:726">
                  <span class="activity-option-card__icon" aria-hidden="true"></span>
                  <span class="activity-option-card__content">
                    <span class="activity-option-card__title">Crosstrainer</span>
                    <span class="activity-option-card__description">25 min · Inomhus</span>
                  </span>
                  <span class="activity-option-card__state" aria-hidden="true"></span>
                </button>
              </li>
            </ul>
          </section>
        </div>

        <button class="primary-action" type="button" data-node-id="94:691">Välj Aktivitet</button>
      </section>
    </main>
  </body>
</html>
